  .mwtools input[type=text] { min-height: 44px; }
  .mwonly { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14px; white-space: nowrap; }
  .mwonly input { width: 20px; height: 20px; accent-color: var(--accent); }
  .mwopts { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
  .mwopt { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .mwopt:last-child { border-bottom: 0; }
  .mwopt.on { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); box-shadow: inset 4px 0 0 var(--accent); }
  .mwopt .nr { font-weight: 700; color: var(--muted); font-size: 14px; }
  .mwopt .om { font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .mwopt .om small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .mwopt .qty { display: flex; align-items: center; gap: 3px; }
  .mwopt .qty button { font: inherit; font-weight: 700; font-size: 18px; width: 34px; height: 40px; padding: 0; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .mwopt .qty input { width: 36px; min-height: 40px; padding: 4px; text-align: center; font-weight: 700; }
  .mwmail { display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .mwmail.off { opacity: .5; }
  .mwchead { display: grid; grid-template-columns: 52px 1fr 90px 44px; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 8px; }
  .mwcat { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  .mwcat summary { cursor: pointer; font-weight: 600; min-height: 36px; }
  .mwcrow { display: grid; grid-template-columns: 52px 1fr 90px 44px; gap: 6px; margin-top: 6px; }
  .mwcrow input { min-height: 42px; padding: 8px; }
  .mwcrow .btn { min-height: 42px; padding: 0; }
  .ogtag { color: var(--accent); }
  .ogsmall { font-family: "Barlow", system-ui, sans-serif; font-size: 14px; font-weight: 600; color: var(--muted); }
  .elev { margin-bottom: 14px; } .elev .lbl { margin: 0 0 4px; } .elev svg { border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
  .bkind .kzimg img { aspect-ratio: 1; height: auto; object-fit: cover; }
  .bkrad { display: grid; grid-template-columns: 70px 1fr; gap: 14px; align-items: start; }
  .bkrad img { width: 70px; display: block; }
  .bkletop { color: var(--danger); font-size: 14px; margin: 6px 0; }
  .bkpaks { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 560px) { .bkpaks { grid-template-columns: 1fr 1fr; } }
  .bkpak { padding: 10px; }
  .bkrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 520px) { .bkrow { grid-template-columns: repeat(2, 1fr); } .bkrow:has(> :nth-child(3):last-child) { grid-template-columns: repeat(3, 1fr); } .bksw img { aspect-ratio: 2 / 1; } }
  .bksw img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .bksw small { display: block; font-size: 12px; line-height: 1.25; margin-top: 4px; color: var(--muted); overflow-wrap: anywhere; }
  .bksw small b { color: var(--ink); }
  .phbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lblbtn { display: flex; align-items: center; justify-content: center; text-align: center; }
  .phbtns .btn { display: flex; align-items: center; justify-content: center; text-align: center; }
  .vh { position: absolute !important; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); pointer-events: none; }
  [hidden] { display: none !important; }
</style>

      var img = document.createElement('img'); var srcNow = photoSrc(id); if (srcNow) img.src = srcNow; img.alt = idx === 0 ? 'Overzichtsfoto' : 'Foto'; img.loading = 'lazy';

        removePhoto(id);
      });
      t.appendChild(x);
      if (idx > 0) {

  async function saveDbPhoto(file) {

  async function storePhoto(file) {

      var id = null, why = '';

      }

      toast(msg); if (st) st.textContent = msg;

  }

  function eur(v) { return (Math.round((v || 0) * 100) / 100).toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' }); }

    var items = rows.map(function (o) { var p = projOf(o); return { o: o, p: p, ps: p.startG, pe: p.gereedG, ws: p.startW, we: p.gereedW || (p.startW ? t : ''), lev: p.leverDatum }; }).filter(function (r) { return r.ps || r.pe || r.ws; });
    if (items.length) {
      var ds = []; items.forEach(function (r) { [r.ps, r.pe, r.ws, r.we, r.lev].forEach(function (q) { if (q) ds.push(q); }); }); ds.push(t); ds.sort();
      var st = new Date(ds[0] + 'T12:00:00'); st.setDate(st.getDate() - ((st.getDay() + 6) % 7) - 7);
      var en = new Date(ds[ds.length - 1] + 'T12:00:00'); en.setDate(en.getDate() + 14);
      var days = Math.max(14, Math.round((en - st) / 86400000)), LW = 170, px = (d.W - 2 * M - LW) / days;
      var X = function (q) { return M + LW + Math.round((new Date(q + 'T12:00:00') - st) / 86400000) * px; };
      var drawAxis = function () { need(40); for (var i = 0; i <= days; i += 7) { var dd = new Date(st); dd.setDate(dd.getDate() + i); d.text(M + LW + i * px + 2, y + 8, 'wk ' + isoWk(dd), { size: 7, color: GR }); } y += 14; };
      var full = 24 + 14 + items.length * 18 + 22; if (y + full > bottom && full < bottom - 52) newPage();
      sub('Planning'); drawAxis();
      var gridTop = y;
      items.forEach(function (r, k) {
        if (y + 18 > bottom) { newPage(); drawAxis(); gridTop = y; }
        if (k % 2) d.rect(M, y - 2, d.W - 2 * M, 18, '#F6EFE9');
        for (var i = 0; i <= days; i += 7) d.line(M + LW + i * px, y - 2, M + LW + i * px, y + 16, 0.4, LN);
        d.text(M + 2, y + 10, d.wrap(r.o.adres || 'Zonder adres', LW - 8, 8.5, false)[0], { size: 8.5, color: INK });
        if (r.ps && r.pe) { var x1 = X(r.ps), x2 = X(r.pe) + px; d.line(x1, y + 1, x2, y + 1, 0.8, '#9AA0A6'); d.line(x1, y + 13, x2, y + 13, 0.8, '#9AA0A6'); d.line(x1, y + 1, x1, y + 13, 0.8, '#9AA0A6'); d.line(x2, y + 1, x2, y + 13, 0.8, '#9AA0A6'); }
        if (r.ws) { var late = r.p.gereedG && (r.p.gereedW || t) > r.p.gereedG; d.rect(X(r.ws), y + 4, Math.max(2, X(r.we) - X(r.ws) + px), 6, r.p.gereedW ? '#2F9E44' : late ? '#C92A2A' : '#2F6FB3'); }
        if (r.lev) d.rect(X(r.lev) + px / 2 - 3, y + 4, 6, 6, OR);
        y += 18;
      });
      var tx2 = X(t) + px / 2; d.line(tx2, gridTop - 4, tx2, y, 1.2, '#C92A2A'); d.text(tx2 + 3, gridTop + 4, 'vandaag', { size: 7, color: '#C92A2A' });
      y += 8; need(14); var lx2 = M;
      [['Gepland', null], ['Werkelijk', '#2F6FB3'], ['Gereed', '#2F9E44'], ['Uitloop', '#C92A2A'], ['Levering', OR]].forEach(function (l) {
        if (l[1]) d.rect(lx2, y - 6, 9, 6, l[1]); else { d.line(lx2, y - 6, lx2 + 9, y - 6, 0.8, '#9AA0A6'); d.line(lx2, y, lx2 + 9, y, 0.8, '#9AA0A6'); }
        lx2 += 14 + d.text(lx2 + 13, y, l[0], { size: 8, color: '#444444' }) + 14;
      });
    }
    var n = d.pages.length;
    d.pages.forEach(function (ops, i) { d.cur = ops; d.line(M, d.H - 30, d.W - M, d.H - 30, 0.5, LN); d.text(M, d.H - 18, 'Constructif  ·  Opnameformulier BKT  ·  Dashboard', { size: 7.5, color: GR }); d.text(d.W - M, d.H - 18, 'Pagina ' + (i + 1) + ' van ' + n, { size: 7.5, color: GR, align: 'right' }); });
    var sl = function (s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); };
    var name = 'Dashboard_' + (dashProj ? sl(dashProj) + '_' : '') + (dashClus ? sl(dashClus) + '_' : '') + t + '.pdf';
    try { await downloadsApi.save({ filename: name, data: new Blob([d.build()], { type: 'application/pdf' }) }); toast('PDF opgeslagen: ' + name); }
    catch (err) { if (!err || err.code !== 'declined') toast('PDF opslaan niet gelukt'); }
  }

  // ---------- opgeslagen opname (.html) weer openen om te wijzigen ----------
  function readText(file) { return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(String(fr.result || '')); }; fr.onerror = rej; fr.readAsText(file); }); }
  function parseOpnameFile(txt) {
    var m = txt.match(/<script type="application\/json" id="opname-data">([\s\S]*?)<\/script>/), o = null;
    try { if (m) o = JSON.parse(m[1]); } catch (e) { o = null; }
    if (!o || !o.rooms) return null;
    // foto's die in het bestand zijn meegeschreven, per ruimte in dezelfde volgorde als in de opname
    var imgs = {};
    try {
      var doc = new DOMParser().parseFromString(txt, 'text/html');
      Array.prototype.forEach.call(doc.querySelectorAll('section.room'), function (sec) {
        var bar = sec.querySelector('.bar'), ph = sec.querySelector('.ph'); if (!bar || !ph) return;
        var name = bar.firstChild && bar.firstChild.nodeValue ? bar.firstChild.nodeValue.trim() : '';
        var Rm = ROOMS.filter(function (r) { return r.name === name; })[0]; if (!Rm || imgs[Rm.key]) return;
        imgs[Rm.key] = Array.prototype.map.call(ph.querySelectorAll('img'), function (i) { return i.getAttribute('src') || ''; }).filter(function (x) { return x.indexOf('data:image') === 0; });
      });
    } catch (e) {}
    return { o: o, imgs: imgs };
  }
  async function restorePhotos(o, imgs) {
    var keys = Object.keys(imgs).filter(function (k) { return imgs[k].length && o.rooms[k]; }), n = 0;
    for (var i = 0; i < keys.length; i++) {
      var ids = [];
      for (var j = 0; j < imgs[keys[i]].length; j++) {
        try { var blob = await (await fetch(imgs[keys[i]][j])).blob(); ids.push(await storePhoto(blob)); n++; } catch (e) {}
      }
      if (ids.length) o.rooms[keys[i]].photos = ids;
    }
    return n;
  }
  async function importFiles(files) {
    var done = 0, skipped = 0, bad = 0, photos = 0, last = null;
    for (var i = 0; i < files.length; i++) {
      toast('Bestand ' + (i + 1) + ' van ' + files.length + ' openen…');
      var txt; try { txt = await readText(files[i]); } catch (e) { bad++; continue; }
      if (/^\s*\{/.test(txt)) { try { var bk = JSON.parse(txt); if (bk && bk.type === 'opnameformulier-backup') { var rb = await importBackup(bk); done += rb.done; skipped += rb.skipped; photos += rb.photos; continue; } } catch (e) {} }
      var res = parseOpnameFile(txt); if (!res) { bad++; continue; }
      var o = ensureRooms(res.o), ex = opnames.filter(function (x) { return x.id === o.id; })[0];
      if (ex && (ex.updated || 0) >= (o.updated || 0)) { skipped++; last = ex; continue; }
      photos += await restorePhotos(o, res.imgs);
      if (ex) opnames = opnames.filter(function (x) { return x !== ex; });
      opnames.push(o); last = o;
      cur = o; dirty = true; await flushSave();
      done++;
    }
    cur = null;
    if (files.length === 1 && last) { openOpname(last); toast(done ? 'Opname geopend. Je kunt hem nu wijzigen.' : 'Deze opname staat al (in een nieuwere versie) in je lijst en wordt geopend.'); return; }
    renderList();
    var parts = [];
    if (done) parts.push(done + (done === 1 ? ' opname' : ' opnames') + ' toegevoegd' + (photos ? ' met ' + photos + ' foto' + (photos === 1 ? '' : '’s') : ''));
    if (skipped) parts.push(skipped + ' stond al in je lijst');
    if (bad) parts.push(bad + ' bestand' + (bad === 1 ? '' : 'en') + ' zonder opnamegegevens');
    toast(parts.join(' · ') || 'Niets geopend');
  }
  $('importFile').addEventListener('change', function (e) { var fl = Array.prototype.slice.call(e.target.files || []); e.target.value = ''; if (fl.length) importFiles(fl); });

  // ---------- events ----------
  $('newOpname').addEventListener('click', startNew);
  $('openDash').addEventListener('click', openDash);
  bindPlanning();
  $('back').addEventListener('click', goBack);
  $('exportAll').addEventListener('click', exportAll);
  $('printAll').addEventListener('click', printReport);
  $('lightbox').addEventListener('click', function () { $('lightbox').hidden = true; });
  [['fAdres', 'adres'], ['fKlant', 'klant'], ['fDatum', 'datum'], ['fBouwjaar', 'bouwjaar']].forEach(function (p) {
    $(p[0]).addEventListener('input', function (e) { if (!cur) return; cur[p[1]] = e.target.value; scheduleSave(); });
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushSave(); });
  window.addEventListener('pagehide', flushSave);

  // ---------- back-up van alle opnames (losse versie: alles staat op dit apparaat) ----------
  async function backupAll() {
    await flushSave();
    var photos = {};
    for (var i = 0; i < opnames.length; i++) {
      var o = opnames[i];
      for (var k in (o.rooms || {})) {
        var ph = (o.rooms[k] && o.rooms[k].photos) || [];
        for (var j = 0; j < ph.length; j++) { if (isDbPhoto(ph[j])) { var s = await loadDbPhoto(ph[j]); if (s) photos[ph[j]] = s; } }
      }
    }
    var data = { type: 'opnameformulier-backup', app: OG.naam, created: new Date().toISOString(), opnames: opnames, photos: photos };
    saveFile('opnames-backup-' + slug(OG.naam) + '-' + todayStr() + '.json', JSON.stringify(data));
  }
  async function importBackup(bk) {
    var r = { done: 0, skipped: 0, photos: 0 };
    if (bk.photos && phCol) { for (var id in bk.photos) { try { await phCol.doc(id).set({ src: bk.photos[id], ts: Date.now() }); phCache[id] = bk.photos[id]; r.photos++; } catch (e) {} } }
    var list = Array.isArray(bk.opnames) ? bk.opnames : [];
    for (var i = 0; i < list.length; i++) {
      var o = ensureRooms(list[i]), ex = opnames.filter(function (x) { return x.id === o.id; })[0];
      if (ex && (ex.updated || 0) >= (o.updated || 0)) { r.skipped++; continue; }
      if (ex) opnames = opnames.filter(function (x) { return x !== ex; });
      opnames.push(o); cur = o; dirty = true; await flushSave(); r.done++;
    }
    cur = null;
    return r;
  }
  if ($('backupBtn')) $('backupBtn').addEventListener('click', backupAll);

  // ---------- start ----------
  opnames = loadLocal();
  renderList(); setStatus();

  async function migrateLocal(col) {
    if (migrated) return; migrated = true;
    var local = loadLocal(); if (!local.length) return;
    try { for (var i = 0; i < local.length; i++) await col.doc(local[i].id).set(local[i]); try { localStorage.setItem(LS_KEY, '[]'); } catch (e) {} }
    catch (e) { migrated = false; }
  }
  (async function init() {
    if (!window.claude || !window.claude.use) return;
    try {
      var r = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads'), claude.use('assets')]);
      downloadsApi = r[2]; assetsApi = r[3]; updateDlButtons();
      var db = r[0], user = r[1]; if (!db || !user) return;
      var id = await user.id(); if (!id) return;
      var col = db.collection('data/users/' + id);
      store = { col: col }; setStatus();
      try { phCol = db.collection('data/users/' + id + '/_ph/items'); } catch (e) { phCol = null; }
      if (screen === 'edit') renderPhotos();
      col.onSnapshot(function (snap) {
        opnames = [];
        snap.docs.forEach(function (d) {
          var o = d.data() || {};
          if (d.id === MW_DOC) { mwApplyRemote(o); return; }
          if (d.id.charAt(0) === '_') return;
          o.id = d.id; opnames.push(o);
        });
        if (screen === 'list') renderList();
        if (screen === 'dash') renderDash();
        migrateLocal(col);
      }, function () { store = null; opnames = loadLocal(); if (screen === 'list') renderList(); setStatus(); });
    } catch (e) { /* stay local */ }
  })();
})();
