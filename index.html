<style>
  :root { --bg: #efeae1; --surface: #fbf8f2; --ink: #1d1b17; --muted: #6b655a; --line: #d8d0c1; --accent: #d9480f; --danger: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171512; --surface: #221f1b; --ink: #f1ece3; --muted: #a39b8c; --line: #3a352e; --accent: #ff7a2e; --danger: #ff8a7a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .stripe { height: 10px; background: repeating-linear-gradient(-45deg, #f5b800 0 14px, #1d1b17 14px 28px); }
  main { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .brand img { width: 56px; height: 56px; border-radius: 4px; }
  h1 { font-size: 24px; line-height: 1.15; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  input[type=password] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; min-height: 48px; }
  input:focus { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
  .chk { display: flex; gap: 10px; align-items: center; font-size: 15px; margin: 14px 0 18px; cursor: pointer; }
  .chk input { width: 22px; height: 22px; accent-color: var(--accent); }
  button { width: 100%; font: inherit; font-weight: 600; font-size: 17px; min-height: 50px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--danger); font-weight: 600; font-size: 15px; min-height: 22px; margin-top: 12px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 18px; text-align: center; }
</style>

  var KEY_LS = 'opname-sleutel-' + APP;
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function ub64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function lsGet() { try { return localStorage.getItem(KEY_LS); } catch (e) { return null; } }
  function lsSet(v) { try { if (v === null) localStorage.removeItem(KEY_LS); else localStorage.setItem(KEY_LS, v); } catch (e) {} }
  function decryptWith(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, k, b64(CT)); })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function deriveRaw(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256); });
  }
  function openApp(html) {
    window.__OPNAME_LOCK = function () { lsSet(null); location.reload(); };
    document.open(); document.write(html); document.close();
  }
  function showForm(msg) {
    document.getElementById('wait').hidden = true;
    document.getElementById('f').hidden = false;
    document.getElementById('err').textContent = msg || '';
    setTimeout(function () { document.getElementById('pw').focus(); }, 50);
  }
  if (!window.crypto || !crypto.subtle) { document.getElementById('wait').textContent = 'Deze browser kan het formulier niet openen. Gebruik Safari, Chrome of Edge via https.'; return; }
  var saved = lsGet();
  if (saved) decryptWith(b64(saved)).then(openApp, function () { lsSet(null); showForm(''); });
  else showForm('');
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value, btn = document.getElementById('go');
    if (!pw) return;
    btn.disabled = true; btn.textContent = 'Controleren…'; document.getElementById('err').textContent = '';
    deriveRaw(pw).then(function (raw) {
      return decryptWith(raw).then(function (html) {
        if (document.getElementById('rem').checked) lsSet(ub64(raw));
        openApp(html);
      });
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Openen';
      document.getElementById('err').textContent = 'Onjuist wachtwoord. Probeer het opnieuw.';
      document.getElementById('pw').select();
    });
  });
